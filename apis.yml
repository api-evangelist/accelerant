apis:
- aid: accelerant:risk-exchange-platform
  name: Accelerant Risk Exchange Platform
  description: 'The member-facing Accelerant Risk Exchange platform and its supporting
    API surface. Accelerant states that its risk indices plug directly into Member
    underwriting and policy administration systems via API, and it operates a dedicated
    API host at api.accelerant.ai alongside a Mintlify-hosted developer documentation
    site at docs.accelerant.ai. Both surfaces are gated: docs.accelerant.ai redirects
    unauthenticated requests to the Accelerant platform sign-in, and api.accelerant.ai
    is fronted by a WAF that returns HTTP 403 to anonymous requests. No machine-readable
    OpenAPI, GraphQL, AsyncAPI or MCP contract could be retrieved anonymously as of
    this profiling pass — see well-known/accelerant-well-known.yml for the full probe
    log. The platform does publish an anonymous OpenID Connect discovery document and
    JWKS.'
