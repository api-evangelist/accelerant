aid: accelerant
name: Accelerant
description: 'Accelerant Holdings (NYSE: ARX) operates the Accelerant Risk Exchange,
  a data-driven marketplace that connects underwriters of specialty insurance risk
  — MGAs, program administrators, captive managers and retail brokers, referred to
  as Members — with risk capital providers including insurers, reinsurers and institutional
  investors. Founded in 2018 and headquartered in Grand Cayman with operations across
  the United States, Canada, the United Kingdom, Europe and Australia, the company
  runs three segments: Exchange Services, MGA Operations and Underwriting. Its member
  platform at app.accelerant.ai delivers AI and machine-learning underwriting products
  — risk scoring, portfolio risk monitoring, geospatial intelligence, product intelligence,
  underwriting referrals and bordereaux (BDX) data submission and observability — and
  the company states that its risk indices plug directly into Member underwriting and
  policy administration systems via API. Developer documentation is published at docs.accelerant.ai
  behind Member authentication; the platform publishes an anonymous OpenID Connect
  discovery document and JWKS at app.accelerant.ai.'
